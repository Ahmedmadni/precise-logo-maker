name: Verify studio and build Android debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bunx vitest run
      - name: Type-check TypeScript
        run: bunx tsc --noEmit
      - name: Build website
        run: bun run build
      - name: Build standalone offline Android editor
        run: bun run build:mobile
      - name: Verify Android bundle contains offline editor and packaged fonts
        run: |
          test -s mobile-dist/index.html
          test -d mobile-dist/assets
          find mobile-dist/assets -type f \( -iname '*.woff' -o -iname '*.woff2' \) | grep -q .
          grep -q 'assets/' mobile-dist/index.html
          if grep -Eq 'server:.*https://|url:.*lovable.app' capacitor.config.ts; then
            echo "Remote server URL is not permitted in offline Android config"
            exit 1
          fi
          if grep -Eq 'https://precise-logo-maker\\.lovable\\.app' mobile-dist/index.html; then
            echo "Android startup still depends on the hosted website"
            exit 1
          fi
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's 2026 Ubuntu runner already includes the Android command-line SDK.
      # Avoid setup-android@v3: it invokes the removed 'sdkmanager tools' package.
      - name: Ensure Android compile SDK is installed
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android Studio project
        run: bunx cap add android
      - name: Register native Android file picker
        run: node scripts/install-native-documents.mjs
      - name: Validate native Android plugin registration
        run: |
          grep -q "registerPlugin(NativeDocumentsPlugin.class)" android/app/src/main/java/app/lovable/logogridstudio/MainActivity.java
          test -s android/app/src/main/java/app/lovable/logogridstudio/NativeDocumentsPlugin.java
      - name: Synchronize Android project
        run: bunx cap sync android
      - name: Assemble unsigned-for-distribution debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK for device verification
        uses: actions/upload-artifact@v4
        with:
          name: LogoGridStudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
