name: Verify studio and build Android debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/arabic-lettering-android-studio
      - feat/arabic-outline-composer

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Sync dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/arabic-outline-composer'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock Arabic font and OpenType dependencies'
            git push origin HEAD:feat/arabic-outline-composer
          fi
      - name: Run tests
        run: bunx vitest run
      - name: Type-check TypeScript
        run: bunx tsc --noEmit
      - name: Build website
        run: bun run build
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's 2026 Ubuntu runner already includes the Android command-line SDK.
      # Avoid setup-android@v3: it invokes the removed 'sdkmanager tools' package.
      - name: Ensure Android compile SDK is installed
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android Studio project
        run: bunx cap add android
      - name: Synchronize Android project
        run: bunx cap sync android
      - name: Assemble unsigned-for-distribution debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK for device verification
        uses: actions/upload-artifact@v4
        with:
          name: LogoGridStudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
